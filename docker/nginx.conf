server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse-proxies the API onto the same origin as the static front-end,
    # so the browser never needs CORS (including CORS-over-SSE, which is
    # fiddly to get right). Buffering is off and the read timeout is long
    # because /api/games/{id}/events is a long-lived Server-Sent Events
    # stream — nginx's default buffering and 60s timeout would otherwise
    # either delay events or cut the connection mid-game.
    location /api/ {
        proxy_pass http://game-logic:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
